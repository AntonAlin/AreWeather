<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Off the map — ÅreWeather</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M6 82 38 26l17 29 9-14 24 41z' fill='%234fd1ff'/%3E%3Cpath d='M38 26l10 18-10 8-9-7z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  /* Inlined deliberately: a 404 is served from an arbitrary path, so a relative
     stylesheet link cannot be trusted to resolve. The full stylesheet is loaded
     afterwards by script, once the correct base path is known. */
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 16px;
    text-align: center; background: #06080b; color: #eef2f7;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    letter-spacing: -0.011em; padding: 32px;
  }
  h1 { font-size: clamp(2.2rem, 7vw, 3.6rem); font-weight: 700; letter-spacing: -0.04em; margin: 0; }
  p { color: #9aa6b6; max-width: 46ch; margin: 0 auto; line-height: 1.6; }
  .code {
    font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: .72rem;
    letter-spacing: .3em; color: #66717f; text-transform: uppercase; margin: 0;
  }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
  .nav-link {
    font-size: .78rem; color: #9aa6b6; text-decoration: none; padding: 8px 16px;
    border: 1px solid rgba(255,255,255,.12); border-radius: 999px; transition: .18s;
  }
  .nav-link:hover { color: #fff; border-color: rgba(255,255,255,.28); }
</style>
</head>
<body>
  <p class="code">Error 404 · no such page</p>
  <h1>Off the map</h1>
  <p>Whatever you were looking for is not at this address. The weather, however, is doing fine
    without it.</p>
  <div class="actions">
    <a class="nav-link" id="home" href="/">← Back to the forecast</a>
    <a class="nav-link" id="method" href="/methods.html">Method &amp; sources</a>
  </div>
<script>
  /* On a custom domain the site is served from the root; on github.io it lives
     under the repository name. Work out which, rather than hardcoding one and
     breaking the other. */
  var REPO_BASE = '/AreWeather/';
  var base = location.hostname.endsWith('github.io') ? REPO_BASE : '/';
  document.getElementById('home').href = base;
  document.getElementById('method').href = base + 'methods.html';
  var css = document.createElement('link');
  css.rel = 'stylesheet';
  css.href = base + 'styles.css';
  document.head.appendChild(css);
</script>
</body>
</html>
